name: Security & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-security-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pip-audit

    - name: Run Pytest Test Suite
      env:
        SECRET_KEY: test_ephemeral_jwt_secret_key_32bytes_minimum
        ENV: development
      run: |
        pytest -v

    - name: Run Bandit SAST Security Analysis
      run: |
        bandit -r backend/app -x backend/app/static -ll

    - name: Run Dependency Vulnerability Audit
      run: |
        pip-audit -r requirements.txt
