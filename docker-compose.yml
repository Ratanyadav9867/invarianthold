version: '3.8'

services:
  invarianthold:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invarianthold-app
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=InvariantHold
      - ENV=production
      - DATABASE_URL=sqlite:///./invarianthold.db
      - SECRET_KEY=REDACTED_SECRET_KEY
      - DEFAULT_PACKET_COUNT=1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
