version: '3.8'

services:
  invarianthold:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invarianthold-app
    ports:
      - "8000:8000"
    env_file:
      # Copy .env.example to .env and fill in real values before running.
      # .env is gitignored and never committed — no secrets live in this file.
      - .env
    environment:
      - PROJECT_NAME=InvariantHold
      - ENV=production
      - DATABASE_URL=sqlite:///./invarianthold.db
      - DEFAULT_PACKET_COUNT=1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
